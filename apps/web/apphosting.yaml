# Firebase App Hosting settings for the Next.js web app (ADR-0004). Shared by every environment;
# apphosting.staging.yaml and apphosting.production.yaml override per backend environment.
# The backend is connected to this repository with root directory apps/web and automatic rollouts
# OFF: the release workflows roll the website out after the API is promoted
# (docs/operations/release-and-rollback.md).
runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
    availability: [BUILD, RUNTIME]
