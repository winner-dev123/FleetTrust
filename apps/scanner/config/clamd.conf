# clamd for the FleetTrust scanner: local TCP only (the HTTP server is the only client).
Foreground yes
LogTime yes
LogVerbose no
DatabaseDirectory /var/lib/clamav
TCPAddr 127.0.0.1
TCPSocket 3310
# Large enough for the API's biggest upload; the HTTP server enforces MAX_SCAN_BYTES first.
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 200M
MaxThreads 4
# Reloads are triggered by the server after freshclam, so no periodic self-check is needed.
SelfCheck 0
