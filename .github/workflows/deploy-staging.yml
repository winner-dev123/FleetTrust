name: Deploy API to staging

# Manual until a staging project exists (OQ-19). Setup: docs/operations/staging-deployment.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # keyless auth to Google Cloud via Workload Identity Federation

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/fleettrust
  OTEL_COLLECTOR_IMAGE: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required repository variables
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          RUNTIME_SA: ${{ vars.GCP_API_SERVICE_ACCOUNT }}
          CLOUDSQL: ${{ vars.GCP_CLOUDSQL_CONNECTION_NAME }}
        run: |
          missing=""
          for name in GCP_PROJECT_ID GCP_REGION WIF_PROVIDER DEPLOYER RUNTIME_SA CLOUDSQL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Staging is not configured (missing:$missing). See docs/operations/staging-deployment.md."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the image (tagged with the commit SHA)
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker buildx build -f apps/api/Dockerfile -t "${REGISTRY}/api:${GITHUB_SHA}" --push .

      - name: Run database migrations (Cloud Run job, before the new revision serves traffic)
        run: |
          gcloud run jobs deploy fleettrust-migrate \
            --region "$GCP_REGION" \
            --image "${REGISTRY}/api:${GITHUB_SHA}" \
            --service-account "${{ vars.GCP_API_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances "${{ vars.GCP_CLOUDSQL_CONNECTION_NAME }}" \
            --set-secrets DATABASE_URL=fleettrust-database-url:latest \
            --command node --args node_modules/@fleettrust/db/dist/cli/migrate.js \
            --max-retries 0 --task-timeout 600 --quiet
          gcloud run jobs execute fleettrust-migrate --region "$GCP_REGION" --wait

      - name: Deploy the API service
        env:
          APP_ENV: staging
          APP_VERSION: ${{ github.sha }}
          API_IMAGE: ${{ env.REGISTRY }}/api:${{ github.sha }}
          API_SERVICE_ACCOUNT: ${{ vars.GCP_API_SERVICE_ACCOUNT }}
          CLOUDSQL_CONNECTION_NAME: ${{ vars.GCP_CLOUDSQL_CONNECTION_NAME }}
          CORS_ORIGINS: ${{ vars.STAGING_CORS_ORIGINS }}
          API_MIN_INSTANCES: "0"
          API_MAX_INSTANCES: "4"
          TRACE_SAMPLE_RATIO: "1"
          FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          # Staging logs App Check failures without blocking; production must use "enforce".
          APP_CHECK_MODE: monitor
          PUBLIC_API_URL: ${{ vars.STAGING_PUBLIC_API_URL }}
          STORAGE_QUARANTINE_BUCKET: ${{ vars.STAGING_QUARANTINE_BUCKET }}
          STORAGE_SENSITIVE_BUCKET: ${{ vars.STAGING_SENSITIVE_BUCKET }}
          DOCUMENT_KMS_KEY: ${{ vars.STAGING_DOCUMENT_KMS_KEY }}
          CLAMAV_HOST: ${{ vars.STAGING_CLAMAV_HOST }}
        run: |
          envsubst < deploy/cloudrun/api.service.yaml > /tmp/api.service.yaml
          gcloud run services replace /tmp/api.service.yaml --region "$GCP_REGION" --quiet

      - name: Smoke test the new revision
        run: |
          url=$(gcloud run services describe fleettrust-api --region "$GCP_REGION" --format 'value(status.url)')
          curl -sf "$url/health" | grep -q '"status":"ok"'
          curl -sf "$url/health/ready" | grep -q '"status":"ready"'
          echo "Staging API healthy at $url"
