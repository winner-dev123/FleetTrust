name: Deploy to production

# Promotes a release that is already running on staging (docs/operations/release-and-rollback.md):
# the exact image (same digest) is copied from the staging registry, never rebuilt.
# approval (required reviewers on the "production" environment) → migrate (expand-only) → new
# revision with no traffic → smoke test → 10 % canary watched for errors → 100 % → worker →
# website → smoke test the public URLs. Any failure puts all traffic back on the previous revision.
# Off until production exists: repository variable PRODUCTION_ENABLED=true.

on:
  workflow_dispatch:
    inputs:
      release:
        description: Full git commit SHA of a release already deployed to staging
        required: true
        type: string
      canary_minutes:
        description: Minutes the new revision serves 10 % of traffic before going to 100 %
        required: false
        default: "10"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: vars.PRODUCTION_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/fleettrust
      STAGING_REGISTRY: ${{ vars.STAGING_REGISTRY }}
      RELEASE: ${{ inputs.release }}
      CANARY_MINUTES: ${{ inputs.canary_minutes }}
      APP_ENV: production
      APP_VERSION: ${{ inputs.release }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      CLOUDSQL_CONNECTION_NAME: ${{ vars.CLOUDSQL_CONNECTION_NAME }}
      VPC_NETWORK: ${{ vars.VPC_NETWORK }}
      VPC_SUBNET: ${{ vars.VPC_SUBNET }}
      CORS_ORIGINS: ${{ vars.WEB_URL }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      # One warm instance: no cold start for the first request after a quiet period.
      API_MIN_INSTANCES: "1"
      API_MAX_INSTANCES: "10"
      TRACE_SAMPLE_RATIO: "0.1"
      FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      APP_CHECK_MODE: enforce
      STORAGE_QUARANTINE_BUCKET: ${{ vars.QUARANTINE_BUCKET }}
      STORAGE_SENSITIVE_BUCKET: ${{ vars.SENSITIVE_BUCKET }}
      STORAGE_PUBLIC_MEDIA_BUCKET: ${{ vars.PUBLIC_MEDIA_BUCKET }}
      DOCUMENT_KMS_KEY: ${{ vars.DOCUMENT_KMS_KEY }}
      CLAMAV_HOST: ${{ vars.CLAMAV_HOST }}
      OTEL_COLLECTOR_IMAGE: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    steps:
      - name: Check the input and the production environment variables
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          if ! [[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release must be a full 40-character commit SHA"; exit 1
          fi
          if ! [[ "$CANARY_MINUTES" =~ ^[0-9]+$ ]] || [ "$CANARY_MINUTES" -lt 5 ]; then
            echo "::error::canary_minutes must be a whole number, at least 5"; exit 1
          fi
          missing=""
          for name in GCP_PROJECT_ID GCP_REGION WIF_PROVIDER DEPLOYER STAGING_REGISTRY \
            RUNTIME_SERVICE_ACCOUNT CLOUDSQL_CONNECTION_NAME VPC_NETWORK VPC_SUBNET PUBLIC_API_URL \
            WEB_URL STORAGE_QUARANTINE_BUCKET STORAGE_SENSITIVE_BUCKET STORAGE_PUBLIC_MEDIA_BUCKET \
            DOCUMENT_KMS_KEY CLAMAV_HOST; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Production is not fully configured (missing:$missing). See docs/operations/environments.md."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release }}
          fetch-depth: 0
      - name: The release must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE" origin/main \
            || { echo "::error::$RELEASE is not on main"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Copy the exact staging image (same digest) into the production registry
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev,${STAGING_REGISTRY%%/*}" --quiet
          docker buildx imagetools create --tag "${REGISTRY}/api:${RELEASE}" \
            "${STAGING_REGISTRY}/api:${RELEASE}"
          digest=$(docker buildx imagetools inspect "${REGISTRY}/api:${RELEASE}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          staging_digest=$(docker buildx imagetools inspect "${STAGING_REGISTRY}/api:${RELEASE}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          [ "$digest" = "$staging_digest" ] || { echo "::error::digest changed while copying"; exit 1; }
          echo "API_IMAGE=${REGISTRY}/api@${digest}" >> "$GITHUB_ENV"
          echo "Promoting ${RELEASE} as ${digest}"

      - name: Migrate the database (expand-only; the serving release keeps working)
        run: |
          gcloud run jobs deploy fleettrust-migrate --region "$GCP_REGION" --image "$API_IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUDSQL_CONNECTION_NAME" \
            --set-secrets DATABASE_URL=fleettrust-database-url:latest \
            --command node --args node_modules/@fleettrust/db/dist/cli/migrate.js \
            --max-retries 0 --task-timeout 900 --quiet
          gcloud run jobs execute fleettrust-migrate --region "$GCP_REGION" --wait

      - name: Deploy the new API revision with no traffic
        env:
          REVISION: fleettrust-api-${{ github.run_number }}-${{ github.run_attempt }}
        run: bash deploy/cloudrun/deploy.sh candidate deploy/cloudrun/api.service.yaml fleettrust-api

      - name: Smoke test the new revision on its own URL
        env:
          ALLOWED_ORIGIN: ${{ vars.WEB_URL }}
        run: API_URL="$CANDIDATE_URL" EXPECT_VERSION="$RELEASE" node tools/smoke/src/run.ts

      - name: Canary (10 % of traffic), watching the new revision's error rate
        if: env.PREVIOUS_REVISION != ''
        run: |
          bash deploy/cloudrun/deploy.sh promote fleettrust-api "$NEW_REVISION" 10
          filter="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"fleettrust-api\" AND resource.labels.revision_name=\"$NEW_REVISION\" AND httpRequest.requestUrl:*"
          for minute in $(seq 1 "$CANARY_MINUTES"); do
            sleep 60
            API_URL="$CANDIDATE_URL" EXPECT_VERSION="$RELEASE" node tools/smoke/src/run.ts > /dev/null
            total=$(gcloud logging read "$filter" --freshness=90m --limit=5000 --format='value(timestamp)' | wc -l)
            errors=$(gcloud logging read "$filter AND httpRequest.status>=500" --freshness=90m --limit=5000 --format='value(timestamp)' | wc -l)
            echo "minute ${minute}: ${errors} errors in ${total} requests on ${NEW_REVISION}"
            # More than 5 server errors and more than 1 % of requests: stop the release.
            if [ "$errors" -gt 5 ] && [ $((errors * 100)) -gt "$total" ]; then
              echo "::error::canary error rate too high (${errors}/${total})"; exit 1
            fi
          done

      - name: Move all traffic to the new revision
        run: bash deploy/cloudrun/deploy.sh promote fleettrust-api "$NEW_REVISION" 100

      - name: Deploy the worker
        env:
          REVISION: fleettrust-worker-${{ github.run_number }}-${{ github.run_attempt }}
        run: bash deploy/cloudrun/deploy.sh direct deploy/cloudrun/worker.service.yaml fleettrust-worker

      - name: Roll the website out (App Hosting)
        if: vars.APP_HOSTING_BACKEND != ''
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter fleettrust
          pnpm exec firebase apphosting:rollouts:create "${{ vars.APP_HOSTING_BACKEND }}" \
            --git-commit "$RELEASE" --project "$GCP_PROJECT_ID" --force

      - name: Smoke test the public URLs
        env:
          WEB_URL: ${{ vars.WEB_URL }}
          ALLOWED_ORIGIN: ${{ vars.WEB_URL }}
        run: API_URL="$PUBLIC_API_URL" EXPECT_VERSION="$RELEASE" node tools/smoke/src/run.ts

      - name: On any failure, put all traffic back on the previous revision
        if: failure() && env.PREVIOUS_REVISION != ''
        run: |
          bash deploy/cloudrun/deploy.sh promote fleettrust-api "$PREVIOUS_REVISION" 100
          echo "::error::Release ${RELEASE} rolled back to ${PREVIOUS_REVISION}. The database keeps the new (expand-only) schema, which the previous release supports."
